# Demo estática en Netlify. Es un sitio de una sola página (sin router): no hace falta redirect de SPA.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requiere Node ^20.19 o >=22.12.
  NODE_VERSION = "22"

# Los ficheros de /assets llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
